[project]
name = "spindlebench"
version = "0.1.0.dev0"
description = "Benchmark for sleep spindle and K-complex detectors under different references and protocols"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Nayan Sharma" }]
requires-python = ">=3.14"
dependencies = [
    "affiliation",
    "matplotlib>=3.11",
    "mne>=1.13.2",
    "numpy>=2.5",
    "pandas>=3.0",
    "scipy>=1.18",
    "yasa>=0.8.0",
]

[project.scripts]
spindlebench = "spindlebench.cli:main"

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "ruff>=0.14"]

[tool.uv.sources]
# Huet et al. (KDD 2022) affiliation metrics, pinned to the audited commit (MIT)
affiliation = { git = "https://github.com/ahstat/affiliation-metrics-py", rev = "8d8449858096bbade6a6e70848d05c9cc9b846fe" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spindlebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the local datasets or cache (skipped when absent)"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["detectors/sumo/src", "detectors/*/.venv*", "notes", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B905"]  # zip(strict=) not required on Python-3.14 code that predates it

[tool.ruff.lint.per-file-ignores]
# research scripts written before the package: pyflakes stays strict, style rules are relaxed
"experiments/**" = ["E501", "E701", "E702", "E741", "B007", "B023"]
"detectors/**" = ["E501", "E701", "E702", "E741", "B007", "B023", "E401"]
"scripts/make_tables.py" = ["E501", "E741", "B007"]
